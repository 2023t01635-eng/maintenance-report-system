services:
  db:
    image: postgres:16-alpine
    container_name: maintenance-report-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: maintenance_db
      POSTGRES_USER: maintenance_user
      POSTGRES_PASSWORD: maintenance_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maintenance_user -d maintenance_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: maintenance-report-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      API_PORT: 4000
      CORS_ORIGIN: http://localhost:5173
      LOG_LEVEL: info
      JWT_SECRET: change-this-before-final-demo-minimum-32-characters
      DATABASE_URL: postgresql://maintenance_user:maintenance_password@db:5432/maintenance_db?schema=public
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: maintenance-report-web
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:4000/api
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./apps/web/src:/app/apps/web/src

volumes:
  postgres_data:
